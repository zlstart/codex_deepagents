# Optional site trust for HTTPS behind an enterprise proxy.
services:
  preview-image:
    build:
      secrets: [corporate_ca]
  helper-image:
    build:
      secrets: [corporate_ca]
  sandbox-image:
    build:
      secrets: [corporate_ca]
  app:
    build:
      secrets: [corporate_ca]
secrets:
  corporate_ca:
    file: ${FAMSUN_CA_FILE:?path to the public CA certificate}
