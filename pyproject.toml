[project]
name = "famsun-agent"
version = "0.1.0"
description = "A session-isolated engineering agent workbench built on LangChain Deep Agents."
requires-python = ">=3.11,<3.15"
dependencies = [
    "deepagents==0.7.41",
    "langchain==1.5.2",
    "langchain-openai==1.8.5",
    "langchain-mcp-adapters==0.3.2",
    "langgraph-checkpoint-sqlite==3.1.3",
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "httpx>=0.28,<1",
    "argon2-cffi>=25.1,<26",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1"]
eval = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "scipy>=1.17.1",
    "trimesh>=5.2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
